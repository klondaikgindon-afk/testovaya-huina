<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кто ты по имени?</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


    <h1>
        Кто ты по имени????
    </h1>


    <input
        type="text"
        id="nameInput"
        placeholder="Введите имя"
    >


    <button id="checkButton">
        ПРОВЕРИТЬ
    </button>


    <button id="leadersButton" class="leaders-button">
        Лидеры
    </button>


    <button id="telegramButton">
        послать создателя нахуй
    </button>


    <button id="secondButton">
        Картинка свинки (бонус)
    </button>


</main>


<!-- =========================
     РЕЗУЛЬТАТ
========================= -->

<div id="resultModal" class="modal">

    <div class="modalContent">

        <button
            id="closeModal"
            class="closeButton">
            ×
        </button>


        <div class="resultImages">

            <img
                id="resultImage"
                src=""
                alt="Результат"
            >

            <img
                id="resultImage2"
                src=""
                alt="Результат"
            >

        </div>


        <p id="resultText"></p>


        <button id="sendPersonButton">
        </button>


    </div>

</div>


<!-- =========================
     ЛИДЕРЫ
========================= -->

<div id="leadersModal" class="leaders-modal">

    <div class="leaders-panel">


        <div class="crown">
            👑
        </div>


        <h2>
            Лидеры по посыланию
            <br>
            нахуй
        </h2>


        <!--
            СЮДА JAVASCRIPT САМ ЗАГРУЗИТ
            НАСТОЯЩИХ ЛИДЕРОВ ИЗ FIREBASE
        -->

        <div class="leaders-list"></div>


        <button id="closeLeaders">
            Закрыть
        </button>


    </div>

</div>


<!-- =========================
     МУРИНО FM
========================= -->

<div id="musicPlayer">


    <input
        type="range"
        id="musicVolume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
    >


    <button id="musicPlayButton">

        <span id="musicPlayIcon">
            ▶
        </span>

    </button>


    <span id="musicTitle">
        Мурино FM
    </span>


</div>


<audio
    id="musicAudio"
    preload="auto">
</audio>


<!-- =========================
     ФЕЙЕРВЕРК
========================= -->

<canvas id="fireworks"></canvas>


<audio
    id="celebrationSound"
    src="sounds/ura.mp3"
    preload="auto">
</audio>
